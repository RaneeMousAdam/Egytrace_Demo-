<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TRACE FORCE MRV — Cement QA/QC Dashboard: ingests, validates and visualises your V28 cement MRV workbook for CBAM/EU ETS embedded emissions reporting.">
  <title>TRACE FORCE MRV — Cement QA/QC Dashboard</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/print.css">

  <!-- CDN Libraries -->
  <!-- SheetJS (xlsx) -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <!-- Chart.js 4 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* Inline critical-path: loading screen before fonts load */
    #initial-loading {
      position: fixed; inset: 0;
      background: #070f1e;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #initial-loading.hidden { opacity: 0; pointer-events: none; }
    .il-logo {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .il-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #00d4aa, #4facfe);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 24px rgba(0,212,170,0.4);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { box-shadow: 0 4px 24px rgba(0,212,170,0.4); } 50% { box-shadow: 0 4px 40px rgba(0,212,170,0.7); } }
    .il-title { font-family: system-ui,sans-serif; font-size: 18px; font-weight: 700; color: #eef2ff; }
    .il-sub   { font-family: system-ui,sans-serif; font-size: 12px; color: #4a5d80; }
  </style>
</head>
<body>

  <!-- Initial loading screen -->
  <div id="initial-loading">
    <div class="il-logo">
      <div class="il-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20M5 20V8l5 4V8l5 4V4l5 4v12"/></svg>
      </div>
      <div class="il-title">TRACE FORCE MRV</div>
      <div class="il-sub">Cement QA/QC Dashboard — Loading…</div>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app-shell">

    <!-- Sidebar -->
    <aside id="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20M5 20V8l5 4V8l5 4V4l5 4v12"/></svg>
          </div>
          <div class="logo-text">
            <div class="brand">TRACE FORCE</div>
            <div class="sub">MRV · Cement QA/QC</div>
          </div>
        </div>
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Collapse sidebar" aria-label="Toggle sidebar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav" role="list"></nav>
    </aside>

    <!-- Top Bar -->
    <header id="topbar" role="banner"></header>

    <!-- Main Content -->
    <main id="content" role="main" aria-live="polite">
      <!-- Rendered by router -->
    </main>

    <!-- Footer -->
    <footer id="footer" role="contentinfo"></footer>

  </div><!-- /#app-shell -->

  <!-- Upload Prompt (shown when no workbook is loaded) -->
  <!-- Dynamically injected by app.js -->

  <!-- ── JavaScript — load in dependency order ─────────────────── -->
  <!-- 0. Core UI Foundations (Icons & Explanations) -->
  <script src="js/icons.js"></script>
  <script src="js/explain.js"></script>
  <!-- 1. Data model -->
  <script src="js/store.js"></script>
  <!-- 2. Formatting utilities -->
  <script src="js/formatter.js"></script>
  <!-- 3. Workbook parser -->
  <script src="js/parser.js"></script>
  <!-- 4. Chart wrappers -->
  <script src="js/charts.js"></script>

  <!-- 5. Page renderers (all expose window.render* functions) -->
  <script src="js/pages/overview.js"></script>
  <script src="js/pages/governance.js"></script>
  <script src="js/pages/setup.js"></script>
  <script src="js/pages/dcs_boundary.js"></script>
  <script src="js/pages/production.js"></script>
  <script src="js/pages/raw_material.js"></script>
  <script src="js/pages/kiln_fuel.js"></script>
  <script src="js/pages/electricity.js"></script>
  <script src="js/pages/constants.js"></script>
  <script src="js/pages/calculations.js"></script>
  <script src="js/pages/qaqc.js"></script>
  <script src="js/pages/report_outputs.js"></script>
  <script src="js/pages/evidence.js"></script>
  <script src="js/pages/regulatory.js"></script>
  <script src="js/pages/analytics_dashboard.js"></script>

  <!-- 6. Export (PDF + Excel) -->
  <script src="js/export.js"></script>

  <!-- 7. App bootstrap (router, events) — must be last -->
  <script src="js/app.js"></script>

  <script>
    // Hide initial loading screen after fonts/libs load
    window.addEventListener('load', () => {
      setTimeout(() => {
        const il = document.getElementById('initial-loading');
        if (il) il.classList.add('hidden');
        setTimeout(() => { if (il) il.remove(); }, 500);
      }, 400);
    });
  </script>
</body>
</html>
